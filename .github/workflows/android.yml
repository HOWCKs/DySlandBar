name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ubuntu-latest already ships the Android command-line tools. Keeping the
      # SDK setup explicit makes the build independent of whichever API level
      # happens to be preinstalled on the runner.
      - name: Locate Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          for directory in \
            "$SDK_ROOT/cmdline-tools/latest/bin" \
            "$SDK_ROOT/cmdline-tools/bin" \
            "$SDK_ROOT/tools/bin"; do
            if [ -x "$directory/sdkmanager" ]; then
              echo "$directory" >> "$GITHUB_PATH"
              export PATH="$directory:$PATH"
              break
            fi
          done
          command -v sdkmanager

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare downloadable artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DySlandBar-debug.apk
          sha256sum dist/DySlandBar-debug.apk > dist/DySlandBar-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: DySlandBar-debug-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14
