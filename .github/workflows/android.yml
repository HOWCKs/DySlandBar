name: Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain :android:assembleDebug 2>&1 | tee build.log

      - name: Surface Gradle failure summary
        if: steps.build.outcome == 'failure'
        run: |
          echo 'Gradle failure summary:'
          grep -E 'FAILURE:|What went wrong:|Execution failed|error:|Error:' build.log | tail -40 || true
          while IFS= read -r line; do
            echo "::error title=Gradle::$line"
          done < <(grep -E 'FAILURE:|What went wrong:|Execution failed|error:|Error:' build.log | tail -20)

      - name: Upload Gradle outputs for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-outputs
          path: android/build/outputs
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK
        run: |
          echo 'Generated files:'
          find android/build -type f | sort | tail -100 || true
          APK=$(find . -type f -name '*.apk' -print -quit)
          test -n "$APK"
          test -s "$APK"
          cp "$APK" android-debug.apk

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: terra-legion-android-debug
          path: android-debug.apk
          if-no-files-found: error
          retention-days: 14
