name: Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: gradle --no-daemon :android:assembleDebug

      - name: Verify APK
        run: test -s android/build/outputs/apk/debug/android-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: terra-legion-android-debug
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
          retention-days: 14
